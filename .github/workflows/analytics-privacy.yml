name: Opt-in analytics safeguards

on:
  pull_request:
    paths:
      - "src/components/analytics/**"
      - "src/lib/analyticsPrivacy.ts"
      - "src/components/ui/provider.tsx"
      - "src/views/SettingsPage.tsx"
      - "tests/analytics-privacy.test.mjs"
      - "tests/analytics-browser.test.mjs"
      - "docs/analytics-geo-rollout.md"
      - ".github/workflows/analytics-privacy.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: node --test tests/analytics-privacy.test.mjs
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      # Avoid unrelated HowToCook remote sync in npm prebuild.
      - name: Build production without analytics credentials
        env:
          NEXT_PUBLIC_GA4_MEASUREMENT_ID: ""
          NEXT_PUBLIC_SITE_ORIGIN: ""
        run: npx next build
      - name: Install Chromium browser test dependency
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start production Next.js server
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/cubing-analytics-next.log 2>&1 &
          for i in $(seq 1 90); do
            if curl --fail --silent --location --max-time 15 http://127.0.0.1:3000/timer/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/cubing-analytics-next.log
          exit 1
      - name: Verify no GA4 requests in production Chromium
        env:
          BASE_URL: http://127.0.0.1:3000
        run: node --test tests/analytics-browser.test.mjs
      - name: Show server logs on failure
        if: failure()
        run: cat /tmp/cubing-analytics-next.log || true
