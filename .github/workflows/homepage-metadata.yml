name: Homepage metadata

on:
  pull_request:
    paths:
      - "src/app/page.tsx"
      - "src/app/(main)/welcome/page.tsx"
      - "src/lib/homepageMetadata.ts"
      - "tests/homepage-metadata.test.mjs"
      - ".github/workflows/homepage-metadata.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: node --test tests/homepage-metadata.test.mjs
      - run: npm ci
      - run: npx eslint src/app/page.tsx "src/app/(main)/welcome/page.tsx" src/lib/homepageMetadata.ts
      - run: npx tsc --noEmit
      - run: npx next build
