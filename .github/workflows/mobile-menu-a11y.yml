name: Mobile menu accessibility

on:
  pull_request:
    paths:
      - "src/components/layout/AppHeader.tsx"
      - "tests/mobile-menu-a11y.test.mjs"
      - "tests/mobile-menu-a11y-browser.test.mjs"
      - ".github/workflows/mobile-menu-a11y.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-menu:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Static accessibility regression tests
        run: node --test tests/mobile-menu-a11y.test.mjs
      - name: Install project dependencies
        run: npm ci --no-audit --no-fund
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Next.js production build (skip unrelated HowToCook remote prebuild sync)
        run: npx next build
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start production Next.js server
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/cubing-next.log 2>&1 &
          echo $! > /tmp/cubing-next.pid
          for i in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:3000/timer/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/cubing-next.log
          exit 1
      - name: Browser keyboard interaction tests
        env:
          BASE_URL: http://127.0.0.1:3000
        run: node --test tests/mobile-menu-a11y-browser.test.mjs
      - name: Show server logs on failure
        if: failure()
        run: cat /tmp/cubing-next.log || true
