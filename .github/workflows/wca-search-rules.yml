name: WCA search rules

on:
  pull_request:
    paths:
      - "src/views/Wca/wcaSearchRules.ts"
      - "src/views/Wca/WcaPlayersSearchView.tsx"
      - "tests/wca-search-rules.test.mjs"
      - "tests/wca-search-browser.test.mjs"
      - ".github/workflows/wca-search-rules.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rules:
    # Playwright 1.56.1 Chromium installation is not supported on Ubuntu 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test WCA search rules
        run: node --experimental-strip-types --test tests/wca-search-rules.test.mjs

      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      # PR #6 fixes an existing non-ASCII /welcome SSR failure. Only apply its
      # reviewed advertisement file to this disposable CI checkout; never to
      # this PR branch or main. SHA and blob mismatches must fail closed.
      - name: Apply pinned PR #6 SSR prerequisite in disposable checkout
        run: |
          set -euo pipefail
          expected_pr6_sha=4ca67b981e83d3c3273bd3c9bd349b98102a2138
          git fetch --no-tags --depth=1 origin refs/pull/6/head
          actual_pr6_sha=$(git rev-parse FETCH_HEAD)
          if [ "$actual_pr6_sha" != "$expected_pr6_sha" ]; then
            echo "::error::PR #6 head changed ($actual_pr6_sha); re-review before updating the pin."
            exit 1
          fi
          ad_file=src/views/Advertisement/ads/cuberwenjun.tsx
          expected_base_blob=5a719bb75a81db899494e770a842ef3179200939
          actual_base_blob=$(git hash-object "$ad_file")
          if [ "$actual_base_blob" != "$expected_base_blob" ]; then
            echo "::error::Advertisement source changed ($actual_base_blob); re-review integration."
            exit 1
          fi
          git show FETCH_HEAD:"$ad_file" > "$ad_file"
          expected_fixed_blob=027daa390203c767f3799824716a93a597f9ad56
          actual_fixed_blob=$(git hash-object "$ad_file")
          if [ "$actual_fixed_blob" != "$expected_fixed_blob" ]; then
            echo "::error::PR #6 fixed blob differs from reviewed version ($actual_fixed_blob)."
            exit 1
          fi
          grep -Fq 'src={encodeURI(THUMBNAIL_IMG)}' "$ad_file"
          grep -Fq 'src={encodeURI(item.src)}' "$ad_file"
          git diff --name-only
      - name: Build production Next.js with a same-origin mockable API
        run: NEXT_PUBLIC_API_BASE=http://127.0.0.1:3000/v3/cube-api npx next build

      - name: Install Chromium for real browser regression
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start production Next.js with a same-origin mockable API
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/cubing-next.log 2>&1 &
          echo $! > /tmp/cubing-next.pid
          for i in $(seq 1 90); do
            if curl --fail --silent --location --max-time 120 http://127.0.0.1:3000/wca/players/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/cubing-next.log
          exit 1
      - name: Test WCA results in Chromium with mocked API
        env:
          BASE_URL: http://127.0.0.1:3000
        run: node --test tests/wca-search-browser.test.mjs
      - name: Show server logs on failure
        if: failure()
        run: cat /tmp/cubing-next.log || true
