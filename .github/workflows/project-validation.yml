name: Project validation

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/project-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: ESLint
        id: lint
        continue-on-error: true
        run: npm run lint
      - name: TypeScript
        id: types
        continue-on-error: true
        run: npx tsc --noEmit
      - name: Next.js build
        id: build
        continue-on-error: true
        run: npm run build
      - name: Report failures
        if: always()
        env:
          LINT: ${{ steps.lint.outcome }}
          TYPES: ${{ steps.types.outcome }}
          BUILD: ${{ steps.build.outcome }}
        run: |
          echo "ESLint: $LINT"
          echo "TypeScript: $TYPES"
          echo "Next.js build: $BUILD"
          test "$LINT" = success && test "$TYPES" = success && test "$BUILD" = success
