name: Homepage carousel accessibility

on:
  pull_request:
    paths:
      - "src/views/Welcome/AdvertisementCarousel.tsx"
      - "src/views/Welcome/carousel-copy.ts"
      - "src/views/ExternalLinks/externalLinks.css"
      - "tests/carousel-motion.test.mjs"
      - "tests/carousel-browser.test.mjs"
      - ".github/workflows/carousel-a11y.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: carousel-a11y-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  carousel:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Carousel accessibility regressions
        run: node --experimental-strip-types --test tests/carousel-motion.test.mjs
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npx tsc --noEmit
      # PR #6 independently fixes non-ASCII image URL SSR on /welcome.
      # Only use its reviewed file in this disposable runner; never modify
      # the PR #8 branch or main. Fail closed if either prerequisite changes.
      - name: Apply pinned PR #6 SSR prerequisite in disposable checkout
        run: |
          set -euo pipefail
          expected_pr6_sha=4ca67b981e83d3c3273bd3c9bd349b98102a2138
          git fetch --no-tags --depth=1 origin refs/pull/6/head
          actual_pr6_sha=$(git rev-parse FETCH_HEAD)
          if [ "$actual_pr6_sha" != "$expected_pr6_sha" ]; then
            echo "::error::PR #6 head changed ($actual_pr6_sha); re-review before updating the pin."
            exit 1
          fi
          ad_file=src/views/Advertisement/ads/cuberwenjun.tsx
          expected_base_blob=5a719bb75a81db899494e770a842ef3179200939
          actual_base_blob=$(git hash-object "$ad_file")
          if [ "$actual_base_blob" != "$expected_base_blob" ]; then
            echo "::error::Advertisement source changed ($actual_base_blob); re-review the integration."
            exit 1
          fi
          git show FETCH_HEAD:"$ad_file" > "$ad_file"
          expected_fixed_blob=027daa390203c767f3799824716a93a597f9ad56
          actual_fixed_blob=$(git hash-object "$ad_file")
          if [ "$actual_fixed_blob" != "$expected_fixed_blob" ]; then
            echo "::error::PR #6 file differs from reviewed blob ($actual_fixed_blob)."
            exit 1
          fi
          grep -Fq 'src={encodeURI(THUMBNAIL_IMG)}' "$ad_file"
          grep -Fq 'src={encodeURI(item.src)}' "$ad_file"
          git diff --name-only
      - name: Build production Next.js without unrelated HowToCook sync
        run: npx next build
      - name: Install Chromium for browser integration
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start production Next.js server
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/cubing-carousel-next.log 2>&1 &
          for i in $(seq 1 90); do
            if curl --fail --silent --location --max-time 15 http://127.0.0.1:3000/welcome/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/cubing-carousel-next.log
          exit 1
      - name: Exercise carousel in desktop and mobile Chromium
        env:
          BASE_URL: http://127.0.0.1:3000
        run: node --test tests/carousel-browser.test.mjs
      - name: Show Next.js logs on failure
        if: failure()
        run: cat /tmp/cubing-carousel-next.log || true
