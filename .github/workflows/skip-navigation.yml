name: Skip navigation smoke test

on:
  pull_request:
    paths:
      - "src/components/layout/AppShell.tsx"
      - "src/components/layout/SkipToMainLink.tsx"
      - "tests/skip-navigation.test.mjs"
      - "tests/skip-navigation-browser.test.mjs"
      - ".github/workflows/skip-navigation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skip-navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check skip link and main landmark
        run: node --test tests/skip-navigation.test.mjs

  browser-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install project dependencies
        run: npm ci --no-audit --no-fund
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Next.js build
        run: npm run build
      - name: Install headless browser for interaction tests
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start local Next.js server
        run: |
          npm run dev -- --hostname 127.0.0.1 > /tmp/cubing-next.log 2>&1 &
          echo $! > /tmp/cubing-next.pid
          for i in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:3000/welcome > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/cubing-next.log
          exit 1
      - name: Browser keyboard and mobile tests
        env:
          BASE_URL: http://127.0.0.1:3000
        run: node --test tests/skip-navigation-browser.test.mjs
      - name: Show server logs on failure
        if: failure()
        run: cat /tmp/cubing-next.log || true
