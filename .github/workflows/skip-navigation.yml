name: Skip navigation smoke test

on:
  pull_request:
    paths:
      - "src/components/layout/AppShell.tsx"
      - "src/components/layout/SkipToMainLink.tsx"
      - "tests/skip-navigation.test.mjs"
      - "tests/skip-navigation-browser.test.mjs"
      - ".github/workflows/skip-navigation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skip-navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check skip link and main landmark
        run: node --test tests/skip-navigation.test.mjs

  browser-and-build:
    # Playwright 1.56.1 Chromium install is validated on Ubuntu 24.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install project dependencies
        run: npm ci --no-audit --no-fund
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npx tsc --noEmit
      # /welcome production SSR currently requires the unmerged PR #6 ad URL fix.
      # Apply it only in this disposable CI checkout, with fail-closed guards.
      # This PR branch and main remain unchanged by the prerequisite.
      - name: Apply pinned PR #6 SSR prerequisite in CI only
        run: |
          set -euo pipefail
          expected_pr6_sha=4ca67b981e83d3c3273bd3c9bd349b98102a2138
          git fetch --no-tags --depth=1 origin refs/pull/6/head
          actual_pr6_sha=$(git rev-parse FETCH_HEAD)
          if [ "$actual_pr6_sha" != "$expected_pr6_sha" ]; then
            echo "::error::PR #6 head changed; re-review before updating this pin."
            exit 1
          fi
          ad_file=src/views/Advertisement/ads/cuberwenjun.tsx
          expected_base_blob=5a719bb75a81db899494e770a842ef3179200939
          if [ "$(git hash-object "$ad_file")" != "$expected_base_blob" ]; then
            echo "::error::Ad source changed; re-review PR #6 integration."
            exit 1
          fi
          git show FETCH_HEAD:"$ad_file" > "$ad_file"
          expected_fixed_blob=027daa390203c767f3799824716a93a597f9ad56
          if [ "$(git hash-object "$ad_file")" != "$expected_fixed_blob" ]; then
            echo "::error::Unexpected PR #6 ad source blob."
            exit 1
          fi
          grep -Fq 'src={encodeURI(THUMBNAIL_IMG)}' "$ad_file"
          grep -Fq 'src={encodeURI(item.src)}' "$ad_file"
      - name: Next.js production build
        run: npx next build
      - name: Install headless browser for interaction tests
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start production Next.js server
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/cubing-next.log 2>&1 &
          echo $! > /tmp/cubing-next.pid
          for i in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:3000/welcome > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/cubing-next.log
          exit 1
      - name: Browser keyboard and mobile tests
        env:
          BASE_URL: http://127.0.0.1:3000
        run: node --test tests/skip-navigation-browser.test.mjs
      - name: Show server logs on failure
        if: failure()
        run: cat /tmp/cubing-next.log || true
